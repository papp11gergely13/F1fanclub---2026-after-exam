<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Assistant | F1 Fanclub</title>
    <style>
        /* Sötét téma színpaletta */
        :root {
            --bg-page: #0d1117;       /* Háttérszín */
            --bg-panel: #161b22;      /* Panel színe */
            --border-color: #30363d;  /* Keretek színe */
            --text-main: #c9d1d9;     /* Fő szövegszín */
            --accent: #e10600;        /* Dinamikus piros kiemelés */
            --code-text: #a5d6ff;     /* Kódok színe a válaszban */
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        /* A fő vezérlőpult doboza */
        .dashboard-container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        /* Felső címsor */
        .header {
            background: #010409;
            padding: 15px 25px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-size: 14px;
        }

        /* Kis "élő" indikátor pötty */
        .header::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--accent);
            border-radius: 50%;
            margin-right: 15px;
            box-shadow: 0 0 10px var(--accent);
        }

        /* Itt jelenik meg az AI válasza */
        .output-area {
            padding: 30px;
            min-height: 250px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace; /* Programozós betűtípus */
            font-size: 15px;
            line-height: 1.7;
            white-space: pre-wrap; /* Megtartja a kódok sortöréseit */
            color: var(--code-text);
            border-bottom: 1px solid var(--border-color);
        }

        /* Az alsó sáv, ahova írsz */
        .input-section {
            display: flex;
            background: var(--bg-page);
            padding: 15px;
        }

        textarea {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 15px;
            resize: none;
            outline: none;
            padding: 10px 15px;
        }

        textarea::placeholder {
            color: #6e7681;
        }

        /* Küldés gomb dizájn */
        button {
            background: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 0 15px rgba(225, 6, 0, 0.4);
        }

        /* Gördítősáv dizájnolása (Webkit böngészőkhöz) */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-panel); 
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #484f58; 
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            Dev
        </div>
        
        <div id="aiResponse" class="output-area">Rendszer felállva. Várom a C#, PHP vagy webfejlesztési kérdéseket...</div>
        
        <div class="input-section">
            <textarea id="userInput" placeholder="Írd ide a kódot vagy a kérdést..." rows="3"></textarea>
            <button onclick="sendMessage()">Futtatás</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const responseDiv = document.getElementById('aiResponse');
            const message = inputField.value;

            if (!message) return;

            // Vizuális visszajelzés töltés közben
            responseDiv.style.color = "#6e7681";
            responseDiv.innerText = "Feldolgozás folyamatban...";
            
            // Mező kiürítése a küldés után
            inputField.value = '';

            try {
                const response = await fetch('chat.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                if(data.error) {
                    responseDiv.style.color = "var(--accent)";
                    responseDiv.innerText = "Hiba: " + (data.error.message ? data.error.message : JSON.stringify(data.error));
                    return;
                }
                
                const aiText = data.candidates[0].content.parts[0].text;
                
                // Szín visszaállítása és szöveg beírása
                responseDiv.style.color = "var(--code-text)";
                responseDiv.innerText = aiText;
                
            } catch (error) {
                responseDiv.style.color = "var(--accent)";
                responseDiv.innerText = "Hálózati hiba történt a kommunikáció során.";
            }
        }
    </script>
</body>
</html>
